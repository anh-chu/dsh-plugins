# mnemosyne memory engine — required environment.
# These CANNOT be set in ~/.dsh/mnemosyne/config.yaml: that file is inert for
# these keys (verified: importance_weight=0 there still yielded the 31.0%
# default-weight recall). The plugin spawns the mnemosyne CLI as a child of
# this service, so the values must live in the daemon environment.
[Service]
Environment=MNEMOSYNE_IMPORTANCE_WEIGHT=0
Environment=MNEMOSYNE_EMBEDDING_MODEL=BAAI/bge-small-en-v1.5
Environment=MNEMOSYNE_DATA_DIR=/home/sil/.dsh/mnemosyne
# The LLM summariser and the working-memory TTL live in ONE shared file, so the
# daemon, the daily timer and the shell scripts cannot disagree:
#   MNEMOSYNE_LLM_ENABLED / _BASE_URL / _MODEL / _API_KEY / _TIMEOUT / _MAX_TOKENS /
#   _N_CTX, MNEMOSYNE_WM_TTL_HOURS, MNEMOSYNE_SLEEP_PROMPT
# Replaces two Environment= lines that sat here until 2026-10-04:
#   MNEMOSYNE_LLM_ENABLED=false         (summariser off: sleep wrote keyword fragments)
#   MNEMOSYNE_WM_TTL_HOURS=876000       (100 years: the trim never ran, but the sleep
#                                        cutoff, TTL/2, landed five years back, so
#                                        nothing was ever old enough to consolidate)
# A later Environment= for the same name would override the file, so do not
# re-add either of those here. The trim deletes unconsolidated rows older than
# the TTL (core/beam.py:3885); the daily timer consolidates them first.
EnvironmentFile=/home/sil/.dsh/mnemosyne/llm.env
