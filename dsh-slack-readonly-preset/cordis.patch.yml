# Slack read-only agent preset.
#
# Built for the dsh-im Slack bot. "Read-only" here means: no shell, no file
# mutation, no Host state changes. It is enforced in two layers, because the
# preset's plugin list alone is not enough:
#
#   1. only read and search tools are registered here (no bash, pwsh, terminal,
#      subagent, workflow, todo, goal, plan-mode, present, plugin-manager);
#   2. `./slack-readonly-guard.mjs` denies every call outside a small allowlist,
#      which also covers tools that HOST plugins register and a preset cannot
#      unregister.
#
# The session's sandbox mode is NOT the enforcement path: `permission-presets`
# writes the profile default (`danger-full-access`) into every new session as a
# session override, and a preset-level `sandbox-policy` row is only the fallback
# beneath it. Do not rely on a row here for read-only.
#
# tool-fs registers read, write and edit together; there is no config to split
# them, so `write` and `edit` stay registered and the guard denies them. That
# keeps file *reading*, which a question-answering bot needs.
- insert:
    - id: preset-slack-readonly
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: slack-readonly
        name: Slack read-only
        description: Reads and searches only. No shell, no file or Host changes.
        order: 10
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              complete: true
              includeRuntimeContext: false
              prefix: |-
                You are a read-only assistant that answers questions in a Slack workspace.

                Your limits are real, not stylistic:
                - You cannot modify files, run commands, create tasks, or change anything on the Host. Never claim that you changed, created, or fixed something.
                - You can read files, search files, search the web, and use the Slack tools available to you.

                How to answer:
                - Answer from what you can see. Quote a file path and line number when a fact comes from a file, and say so when a fact comes from the web instead.
                - If you cannot find the answer, say what you searched and stop. Do not guess and do not fill the gap with plausible detail.
                - Keep it short. A few sentences or a short list. This is a Slack thread, not a report.
                - Posting to a channel is the human's call. Draft the reply and let them send it.
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          # fetch: false keeps web_fetch out. On this Host it can reach
          # unauthenticated loopback endpoints, and a Slack user drives the bot.
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: false
              searchTimeoutMs: 60000
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          # A package subpath, never a relative path. The registry re-mounts a
          # preset with the declaring context's baseUrl, so "./guard.mjs" never
          # resolved: the row died as "never started", which marked the whole
          # preset broken and hid it from callers that drop broken presets.
          - id: read-only-guard
            name: '@local/dsh-slack-readonly-preset/guard'
